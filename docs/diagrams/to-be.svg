<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><rect width="1600" height="680" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ao" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff" stroke="#000" stroke-width="1.2"/></marker></defs><rect x="1" y="0" width="1598" height="190" fill="none" stroke="#000" stroke-width="2"/><line x1="150" y1="0" x2="150" y2="190" stroke="#000" stroke-width="2"/><text x="75" y="90.1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Преподава-</text><text x="75" y="113.2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">тель</text><rect x="1" y="190" width="1598" height="160" fill="none" stroke="#000" stroke-width="2"/><line x1="150" y1="190" x2="150" y2="350" stroke="#000" stroke-width="2"/><text x="75" y="276.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Веб-система</text><rect x="1" y="350" width="1598" height="160" fill="none" stroke="#000" stroke-width="2"/><line x1="150" y1="350" x2="150" y2="510" stroke="#000" stroke-width="2"/><text x="75" y="425.1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Администра-</text><text x="75" y="448.2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">тор (деканат)</text><rect x="1" y="510" width="1598" height="169" fill="none" stroke="#000" stroke-width="2"/><line x1="150" y1="510" x2="150" y2="679" stroke="#000" stroke-width="2"/><text x="75" y="601.1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Студент</text><circle cx="200" cy="95" r="20" fill="#fff" stroke="#000" stroke-width="2"/><text x="200" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">Начало часа</text><polygon points="300,63 332,95 300,127 268,95" fill="#fff" stroke="#000" stroke-width="2"/><text x="344" y="90.8" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">Первый час</text><text x="344" y="110.4" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">дня?</text><path d="M220,95 H266" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="20" width="260" height="56" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="530.0" y="43.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Создать занятие</text><text x="530.0" y="65.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">(одна или несколько групп)</text><rect x="710" y="20" width="260" height="56" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="840.0" y="43.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Отметить отсутствующих</text><text x="840.0" y="65.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">(по умолчанию все «Был»)</text><rect x="400" y="114" width="260" height="56" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="530.0" y="137.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">«Как в прошлом часе»,</text><text x="530.0" y="159.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">поправить опоздавших</text><path d="M300,63 V48 H398" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="310" y="41.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">да</text><path d="M300,127 V142 H398" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="310" y="167.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">нет</text><path d="M660,48 H708" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="1030" y="62" width="200" height="66" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="1130.0" y="90.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Сохранить</text><text x="1130.0" y="112.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">отметки</text><path d="M970,48 H1000 V82 H1028" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M660,142 H1000 V108 H1028" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="960" y="235" width="300" height="70" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="1110.0" y="265.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Проверить права, сохранить,</text><text x="1110.0" y="287.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">пересчитать процент</text><path d="M1130,128 V233" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="1310" y="235" width="250" height="70" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="1435.0" y="265.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Отчёты</text><text x="1435.0" y="287.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">и кабинет студента</text><path d="M1260,270 H1308" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="1300" y="400" width="180" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="1390.0" y="425.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Просмотреть</text><text x="1390.0" y="447.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">отчёты</text><rect x="720" y="400" width="300" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="870.0" y="425.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Исправить отметку</text><text x="870.0" y="447.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">(«Уважительная» по справке)</text><path d="M1300,430 H1022" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M1000,400 V307" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M1390,305 V398" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ao)"/><rect x="1220" y="565" width="340" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="1390.0" y="590.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Открыть кабинет с телефона</text><text x="1390.0" y="612.3" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">или ПК в сети учебного заведения</text><path d="M1530,305 V563" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ao)"/><circle cx="1100" cy="595" r="20" fill="#fff" stroke="#000" stroke-width="2"/><path d="M1120,595 H1218" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/></svg>