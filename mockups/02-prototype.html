<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прототип — учёт посещаемости</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Токены скопированы из !DESIGN_TOKENS.html (раздел 8). Новых значений здесь нет. */
  :root{
    --font:'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --fs-caption:12px; --fs-small:13px; --fs-body:14px; --fs-lead:16px;
    --fs-h3:20px; --fs-h2:24px; --fs-h1:32px;
    --r-sm:8px; --r:14px; --r-lg:20px; --r-pill:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
    --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
    --row-pad:11px;
  }
  :root,[data-theme="light"]{
    --bg:#F3F4F6; --card:#FFFFFF; --text:#1C1E22; --muted:#656A73;
    --border:#E0E3E8; --hover:#EAECF0;
    --accent:#6D4FD1; --on-accent:#FFFFFF;
    --ok:#1F7A3F;   --ok-bg:#E2F2E7;
    --bad:#B3261E;  --bad-bg:#FBE7E5;
    --info:#0B6B74; --info-bg:#DDF1F2;
    --warn:#935C00; --warn-bg:#FBF0D4;
    --shadow:0 1px 3px rgba(20,20,20,.07);
  }
  [data-theme="dark"]{
    --bg:#16181B; --card:#1F2226; --text:#E6E2DC; --muted:#9A9CA0;
    --border:#2E3338; --hover:#272B30;
    --accent:#A78BFA; --on-accent:#150C2E;
    --ok:#7DD39A;   --ok-bg:#1E3A2A;
    --bad:#F28B82;  --bad-bg:#4A2624;
    --info:#6FD3E0; --info-bg:#1B3F46;
    --warn:#E6C15A; --warn-bg:#463A16;
    --shadow:none;
  }

  /* ================= база ================= */
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:1.5;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  svg.i{width:20px;height:20px;flex:none}
  svg.i.sm{width:16px;height:16px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .muted{color:var(--muted)}
  .mono{font-family:var(--font-mono)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ================= кнопки и поля ================= */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);font-weight:700;font-size:var(--fs-body);padding:10px 16px;min-height:42px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .15s,background .15s}
  .btn svg{width:18px;height:18px}
  .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--card);color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:var(--hover)}
  .btn-danger{background:var(--bad);color:#fff}
  [data-theme="dark"] .btn-danger{color:#2A0E0B}
  .btn-danger:hover{filter:brightness(1.08)}
  .btn-sm{min-height:34px;padding:6px 12px;font-size:var(--fs-small);border-radius:var(--r-sm)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
  .icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
  .icon-btn:hover{background:var(--hover);color:var(--text)}
  .icon-btn.danger:hover{color:var(--bad);background:var(--bad-bg)}
  .icon-btn svg{width:18px;height:18px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field > label,.field > .lbl{font-size:var(--fs-small);font-weight:600}
  .field .help{font-size:var(--fs-caption);color:var(--muted)}
  .field .err{font-size:var(--fs-caption);color:var(--bad);font-weight:600;display:none}
  .field.invalid .err{display:block}
  .field.invalid .ctl{border-color:var(--bad)}
  .ctl{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;min-height:42px}
  .ctl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  select.ctl{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
  .search{position:relative;min-width:0}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
  .search .ctl{padding-left:38px}
  .check{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-small);font-weight:600;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--accent)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
  .form-grid .full{grid-column:1/-1}

  /* ================= бейджи ================= */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px 4px 8px;border-radius:var(--r-pill);white-space:nowrap}
  .chip svg{width:14px;height:14px}
  .chip.present{color:var(--ok);background:var(--ok-bg)}
  .chip.absent{color:var(--bad);background:var(--bad-bg)}
  .chip.excused{color:var(--info);background:var(--info-bg)}
  .chip.late{color:var(--warn);background:var(--warn-bg)}
  .chip.neutral{color:var(--muted);background:var(--hover)}
  .chip.accent{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}

  /* ================= вход ================= */
  .login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .l-aside{padding:var(--sp-12);display:flex;flex-direction:column;justify-content:space-between;gap:var(--sp-8);background:color-mix(in srgb,var(--accent) 11%,var(--bg));border-right:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
  .brand-mark{width:42px;height:42px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
  .brand-mark svg{width:24px;height:24px}
  .brand-name{font-size:var(--fs-lead);font-weight:800;letter-spacing:-.2px;white-space:nowrap}
  .l-main h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.6px;line-height:1.15;max-width:460px}
  .l-main p{font-size:var(--fs-lead);color:var(--muted);margin-top:var(--sp-4);max-width:440px}
  .facts{list-style:none;margin-top:var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-4)}
  .facts li{display:flex;gap:var(--sp-3);align-items:flex-start}
  .fact-ic{width:40px;height:40px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);color:var(--accent);display:grid;place-items:center;flex:none}
  .facts b{display:block}
  .facts .t{font-size:var(--fs-small);color:var(--muted)}
  .l-foot{font-size:var(--fs-caption);color:var(--muted)}
  .l-right{position:relative;display:flex;align-items:center;justify-content:center;padding:var(--sp-12) var(--sp-6)}
  .l-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-8);box-shadow:var(--shadow)}
  .l-card h2{font-size:var(--fs-h2);font-weight:800;letter-spacing:-.3px}
  .l-card .sub{font-size:var(--fs-small);color:var(--muted);margin-top:var(--sp-2)}
  .l-form{display:flex;flex-direction:column;gap:var(--sp-4);margin-top:var(--sp-5)}
  .with-ic{position:relative}
  .with-ic > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px;pointer-events:none}
  .with-ic .ctl{padding-left:44px;padding-right:44px;min-height:46px}
  .with-ic .icon-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
  .alert{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3) var(--sp-4);border-radius:var(--r);font-size:var(--fs-small);font-weight:600}
  .alert svg{width:18px;height:18px;margin-top:1px}
  .alert.err{background:var(--bad-bg);color:var(--bad)}
  .alert.ok{background:var(--ok-bg);color:var(--ok)}
  .alert.info{background:var(--info-bg);color:var(--info)}
  .alert.warn{background:var(--warn-bg);color:var(--warn)}
  .hint{display:flex;gap:var(--sp-2);margin-top:var(--sp-5);font-size:var(--fs-small);color:var(--muted)}
  .hint svg{width:18px;height:18px;margin-top:1px}
  .demo{margin-top:var(--sp-5);border-top:1px dashed var(--border);padding-top:var(--sp-4)}
  .demo-title{font-size:var(--fs-small);font-weight:700;color:var(--muted);margin-bottom:var(--sp-3)}
  .demo-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);width:100%;padding:8px 12px;margin-bottom:var(--sp-2);border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);cursor:pointer;text-align:left;font-size:var(--fs-small)}
  .demo-row:hover{background:var(--hover)}
  .demo-row code{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
  .theme-fab{position:absolute;top:var(--sp-5);right:var(--sp-5)}
  .theme-btn{width:42px;height:42px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
  .theme-btn:hover{background:var(--hover)}
  svg.i-moon{display:none}
  [data-theme="dark"] svg.i-sun{display:none}
  [data-theme="dark"] svg.i-moon{display:block}

  /* ================= оболочка приложения ================= */
  .app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;min-height:100dvh}
  .side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--sp-5) var(--sp-4);gap:var(--sp-6);z-index:30}
  .side .brand{padding:0 var(--sp-2)}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
  .nav-sec{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:var(--sp-3) var(--sp-3) var(--sp-2)}
  .nav a{display:flex;align-items:center;gap:var(--sp-3);padding:10px 12px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
  .nav a:hover{background:var(--hover);color:var(--text)}
  .nav a.active{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:700}
  .side-foot{display:flex;flex-direction:column;gap:var(--sp-3);border-top:1px solid var(--border);padding-top:var(--sp-4)}
  .me{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-2);min-width:0}
  .avatar{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .me-text{min-width:0}
  .me-name{font-weight:700;font-size:var(--fs-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me-role{font-size:var(--fs-caption);color:var(--muted)}
  .side-actions{display:flex;gap:var(--sp-2);padding:0 var(--sp-2)}
  .side-actions .btn{flex:1}

  .content{min-width:0;padding:var(--sp-8) var(--sp-8) var(--sp-12)}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6)}
  .topbar h1{font-size:var(--fs-h2);font-weight:800;letter-spacing:-.3px;line-height:1.2}
  .topbar .sub{font-size:var(--fs-small);color:var(--muted);margin-top:4px}
  .topbar-left{display:flex;align-items:flex-start;gap:var(--sp-3);min-width:0}
  .menu-btn{display:none}
  .actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-small);font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:var(--sp-3);cursor:pointer;background:none;border:0}
  .back:hover{color:var(--accent)}
  .overlay{display:none}

  /* ================= блоки ================= */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .card-pad{padding:var(--sp-5)}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)}
  .card-head h2,.card-head h3{font-size:var(--fs-lead);font-weight:800}
  .stack{display:flex;flex-direction:column;gap:var(--sp-5)}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4)}
  .kpi{padding:var(--sp-4) var(--sp-5)}
  .kpi .v{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
  .kpi .v.accent{color:var(--accent)}
  .kpi .l{font-size:var(--fs-small);color:var(--muted)}
  .toolbar{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:flex-end;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)}
  .toolbar .grow{flex:1;min-width:200px}
  .toolbar .field{min-width:160px}

  .split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--sp-5);align-items:start}
  .glist{list-style:none;padding:var(--sp-2)}
  .glist button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:10px 12px;border-radius:var(--r);border:0;background:transparent;cursor:pointer;text-align:left}
  .glist button:hover{background:var(--hover)}
  .glist button.active{background:color-mix(in srgb,var(--accent) 13%,transparent)}
  .glist button.active .gname{color:var(--accent)}
  .gname{font-weight:700}
  .gmeta{font-size:var(--fs-caption);color:var(--muted)}

  .tabs{display:flex;gap:var(--sp-1);background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:var(--sp-5)}
  .tabs button{border:0;background:transparent;padding:8px 16px;border-radius:calc(var(--r) - 4px);font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs button.active{background:var(--accent);color:var(--on-accent)}

  .acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-4)}
  .acard{padding:var(--sp-4) var(--sp-5);text-align:left;cursor:pointer;border:1px solid var(--border);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .acard:hover{border-color:var(--accent)}
  .acard.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .acard .g{font-weight:800;font-size:var(--fs-lead)}
  .acard .s{font-size:var(--fs-small);color:var(--muted)}
  .acard .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--sp-3)}
  .acard .pct{font-size:22px;font-weight:800;color:var(--accent)}

  /* таблицы */
  .tbl-wrap{overflow-x:auto}
  table.t{width:100%;border-collapse:collapse}
  table.t th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px var(--sp-4);border-bottom:1px solid var(--border);white-space:nowrap}
  table.t td{padding:var(--row-pad) var(--sp-4);border-bottom:1px solid var(--border);vertical-align:middle}
  table.t tr:last-child td{border-bottom:none}
  table.t tbody tr.click{cursor:pointer}
  table.t tbody tr.click:hover td{background:var(--hover)}
  table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
  table.t td.act{text-align:right;white-space:nowrap;width:1%}
  .cell-main{font-weight:700}
  .cell-sub{font-size:var(--fs-caption);color:var(--muted)}
  .bar{display:flex;align-items:center;gap:var(--sp-2);justify-content:flex-end}
  .bar-track{width:90px;height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:var(--accent)}
  .bar b{min-width:42px;text-align:right}
  .empty{padding:var(--sp-10) var(--sp-5);text-align:center;color:var(--muted)}
  .empty svg{width:36px;height:36px;margin-bottom:var(--sp-2);color:var(--muted)}
  .empty b{display:block;color:var(--text);margin-bottom:4px}

  /* отметка посещаемости */
  .mark-head{display:flex;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;align-items:center;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)}
  .counters{display:flex;gap:var(--sp-2);flex-wrap:wrap}
  .mrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;padding:10px var(--sp-5);border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:0}
  .mrow .n{color:var(--muted);font-size:var(--fs-small);text-align:right}
  .mrow .nm{font-weight:700;min-width:0}
  .seg{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:3px}
  .seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 10px;border-radius:calc(var(--r) - 4px);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .seg button svg{width:14px;height:14px}
  .seg button:hover{background:var(--hover)}
  .seg button.on.present{background:var(--ok-bg);color:var(--ok)}
  .seg button.on.absent{background:var(--bad-bg);color:var(--bad)}
  .seg button.on.excused{background:var(--info-bg);color:var(--info)}
  .seg button.on.late{background:var(--warn-bg);color:var(--warn)}
  .sticky-save{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-4) var(--sp-5);background:var(--card);border-top:1px solid var(--border);border-radius:0 0 var(--r-lg) var(--r-lg)}

  /* кабинет студента */
  .hello{padding:var(--sp-6);display:flex;justify-content:space-between;gap:var(--sp-5);flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--accent) 9%,var(--card))}
  .hello h2{font-size:var(--fs-h3);font-weight:800}
  .big-pct{font-size:44px;font-weight:800;color:var(--accent);letter-spacing:-1px;line-height:1}
  .subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-4)}
  .subj{padding:var(--sp-4) var(--sp-5)}
  .subj .h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3)}
  .subj .nm{font-weight:800}
  .subj .pc{font-size:22px;font-weight:800;color:var(--accent)}
  .subj .bar-track{width:100%;margin:var(--sp-3) 0}
  .subj .cnt{display:flex;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-caption);color:var(--muted)}

  /* модальные окна */
  .modal-bg{position:fixed;inset:0;background:rgba(10,10,14,.48);display:flex;align-items:center;justify-content:center;padding:var(--sp-4);z-index:100}
  .modal{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal.wide{max-width:760px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);padding:var(--sp-5) var(--sp-5) 0}
  .modal-head h3{font-size:var(--fs-h3);font-weight:800}
  .modal-body{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)}
  .modal-foot{display:flex;justify-content:flex-end;gap:var(--sp-2);padding:0 var(--sp-5) var(--sp-5);flex-wrap:wrap}

  function translit(n) {
    var m = { а: 'a', б: 'b', в: 'v', г: 'g', ғ: 'g', д: 'd', е: 'e', ё: 'yo', ж: 'zh', з: 'z', и: 'i', ӣ: 'i', й: 'y', к: 'k', қ: 'q', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ӯ: 'u', ф: 'f', х: 'kh', ҳ: 'h', ц: 'ts', ч: 'ch', ҷ: 'j', ш: 'sh', щ: 'sh', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' };
    return (n.split(' ')[0] || '').toLowerCase().split('').map(function (c) { return m[c] != null ? m[c] : (/[a-z0-9]/.test(c) ? c : ''); }).join('');
  }

  /* статистика: процент = (был + опоздал) / (все отметки − уважительные) */
  function calc(records) {
    var c = { present: 0, absent: 0, excused: 0, late: 0, total: records.length };
    records.forEach(function (a) { c[a.status]++; });
    var den = c.total - c.excused;
    c.pct = den > 0 ? Math.round((c.present + c.late) / den * 100) : null;
    return c;
  }
  function pctText(p) { return p == null ? '—' : p + '%'; }
  function bar(p) { return '<div class="bar"><div class="bar-track"><div class="bar-fill" style="width:' + (p || 0) + '%"></div></div><b>' + pctText(p) + '</b></div>'; }
  function attFor(lessonIds, studentIds) {
    var L = {}, S = null;
    lessonIds.forEach(function (i) { L[i] = 1; });
    if (studentIds) { S = {}; studentIds.forEach(function (i) { S[i] = 1; }); }
    return DB.attendance.filter(function (a) { return L[a.lesson_id] && (!S || S[a.student_id]); });
  }

  /* ================= состояние ================= */
  var state = { user: null, groupId: 1, q: '', usersTab: 'users', lessonFilter: 'all', cabSubject: 'all', rep: null, dirty: false, navOpen: false };

  /* ================= тема ================= */
  var THEME_KEY = 'ds-theme';
  function readSaved() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
  function saveTheme(t) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  function systemTheme() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
  function toggleTheme() { var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(n); saveTheme(n); }
  applyTheme(readSaved() || systemTheme());
  function themeBtn() { return '<button type="button" class="theme-btn" data-act="theme" aria-label="Переключить тему">' + ic('i-sun', 'i-sun') + ic('i-moon', 'i-moon') + '</button>'; }

  /* ================= уведомления и окна ================= */
  function toast(msg, icon) {
    var el = document.createElement('div');

  function closeModal() { var m = document.querySelector('.modal-bg'); if (m) m.remove(); document.removeEventListener('keydown', escClose); }
  function escClose(e) { if (e.key === 'Escape') closeModal(); }
  /* opts: title, body, submit, danger, wide, onSubmit(form) -> true | 'текст ошибки', onOpen(el) */
  function modal(opts) {
    closeModal();
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
      '<form novalidate><div class="modal-head"><h3>' + esc(opts.title) + '</h3><button type="button" class="icon-btn" data-close aria-label="Закрыть">' + ic('i-x') + '</button></div>' +
      '<div class="modal-body"><div class="alert err" data-err style="display:none">' + ic('i-alert') + '<span></span></div>' + opts.body + '</div>' +
      '<div class="modal-foot">' + (opts.submit ? '<button type="button" class="btn btn-ghost" data-close>' + (opts.cancel || 'Отмена') + '</button><button type="submit" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '">' + esc(opts.submit) + '</button>' : '<button type="button" class="btn btn-primary" data-close>Понятно</button>') + '</div></form></div>';
    document.body.appendChild(bg);
    var form = bg.querySelector('form');
    bg.addEventListener('mousedown', function (e) { if (e.target === bg) closeModal(); });
    bg.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
    document.addEventListener('keydown', escClose);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!opts.onSubmit) { closeModal(); return; }
      form.querySelectorAll('.field').forEach(function (f) { f.classList.remove('invalid'); });
      var res = opts.onSubmit(form);
      var box = form.querySelector('[data-err]');
      if (res === true) { closeModal(); return; }
      if (typeof res === 'string') { box.style.display = 'flex'; box.querySelector('span').textContent = res; }
    });
    if (opts.onOpen) opts.onOpen(bg);
    var first = form.querySelector('input:not([type=checkbox]),select,textarea');
    (first || form.querySelector('[type=submit]') || form.querySelector('[data-close]')).focus();
    return bg;
  }
  function info(title, text) { modal({ title: title, body: '<div class="alert warn">' + ic('i-alert') + '<span>' + esc(text) + '</span></div>' }); }
  function confirmBox(title, text, okText, onOk) {
    modal({ title: title, body: '<p>' + esc(text) + '</p>', submit: okText, danger: true, onSubmit: function () { onOk(); return true; } });
  }
  function invalid(form, name, msg) {
    var el = form.elements[name], f = el && el.closest('.field');

    return false;
  }
  function fld(label, name, ctl, help) {
    return '<div class="field"><label for="f-' + name + '">' + label + '</label>' + ctl + (help ? '<div class="help">' + help + '</div>' : '') + '<div class="err">Заполните поле</div></div>';
  }
  function inp(name, val, type, extra) { return '<input class="ctl" id="f-' + name + '" name="' + name + '" type="' + (type || 'text') + '" value="' + esc(val == null ? '' : val) + '"' + (extra || '') + '>'; }
  function sel(name, opts, val) {

  }

  /* ================= маршруты ================= */
  var NAV = {
    admin: [

      ['#/groups', 'Группы и студенты', 'i-users'],

  function parseRoute() {
    var h = (location.hash || '').replace(/^#\/?/, '');

  }
  function go(hash) {

        state.dirty = false; draft = null; location.hash = hash;

  var root = document.getElementById('root');

    var r = parseRoute();

  /* делегирование кликов на всё приложение */

  /* ================= экран: вход ================= */

      '<ul class="facts"><li><span class="fact-ic">' + ic('i-clipboard') + '</span><div><b>Отметка за минуту</b><span class="t">Весь список группы на одном экране, статус меняется одним нажатием.</span></div></li>' +

  /* ================= экран: группы и студенты (admin) ================= */

  HANDLERS['pick-group'] = function (t) { state.groupId = Number(t.getAttribute('data-id')); state.q = ''; render(); };
  var searchTimer;
  HANDLERS.search = function (t) {
    clearTimeout(searchTimer);
    var v = t.value;
    searchTimer = setTimeout(function () {
      state.q = v; render();
      var s = root.querySelector('[data-input="search"]'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 200);
  };

  function groupForm(g) {
    return '<div class="form-grid">' + fld('Название', 'name', inp('name', g ? g.name : '', 'text', ' placeholder="Например, ИС-24" maxlength="50"')) +
      fld('Год набора', 'start_year', inp('start_year', g ? g.start_year : 2026, 'number', ' min="2000" max="2100"')) + '</div>';
  }
  function saveGroup(form, g) {
    var name = form.elements.name.value.trim(), year = Number(form.elements.start_year.value), ok = true;
    if (!name) ok = invalid(form, 'name');
    if (!year || year < 2000 || year > 2100) ok = invalid(form, 'start_year', 'Год от 2000 до 2100');
    if (!ok) return false;
    if (DB.groups.some(function (x) { return x.name.toLowerCase() === name.toLowerCase() && (!g || x.id !== g.id); })) return 'Группа с таким названием уже есть';
    if (g) { g.name = name; g.start_year = year; toast('Группа сохранена'); }
    else { var id = nextId('groups'); DB.groups.push({ id: id, name: name, start_year: year }); state.groupId = id; state.q = ''; toast('Группа добавлена'); }
    render(); return true;
  }
  HANDLERS['add-group'] = function () { modal({ title: 'Новая группа', body: groupForm(null), submit: 'Добавить', onSubmit: function (f) { return saveGroup(f, null); } }); };
  HANDLERS['edit-group'] = function (t) { var g = byId(DB.groups, Number(t.getAttribute('data-id'))); modal({ title: 'Группа ' + g.name, body: groupForm(g), submit: 'Сохранить', onSubmit: function (f) { return saveGroup(f, g); } }); };
  HANDLERS['del-group'] = function (t) {
    var g = byId(DB.groups, Number(t.getAttribute('data-id')));
    var s = groupStudents(g.id).length, l = DB.lessons.filter(function (x) { return x.group_id === g.id; }).length, a = DB.assignments.filter(function (x) { return x.group_id === g.id; }).length;
    if (s || l || a) { info('Нельзя удалить группу', 'У группы ' + g.name + ' есть связанные данные: студентов ' + s + ', занятий ' + l + ', назначений ' + a + '. Сначала удалите или перенесите их.'); return; }
    confirmBox('Удалить группу?', 'Группа ' + g.name + ' будет удалена без возможности восстановления.', 'Удалить', function () {
      DB.groups.splice(DB.groups.indexOf(g), 1); toast('Группа удалена', 'i-trash'); render();
    });
  };

  function studentForm(s) {
    var gopts = DB.groups.map(function (g) { return [g.id, g.name]; });
    var html = '<div class="form-grid">' + '<div class="full">' + fld('ФИО', 'full_name', inp('full_name', s ? s.full_name : '', 'text', ' placeholder="Фамилия Имя Отчество" maxlength="150"')) + '</div>' +
      '<div class="full">' + fld('Группа', 'group_id', sel('group_id', gopts, s ? s.group_id : state.groupId)) + '</div></div>';
    if (!s) html += '<label class="check"><input type="checkbox" name="make_account" checked> Сразу создать учётную запись (логин и временный пароль)</label>';
    return html;
  }
  HANDLERS['add-student'] = function () {
    modal({ title: 'Новый студент', body: studentForm(null), submit: 'Добавить', onSubmit: function (f) {
      var n = f.elements.full_name.value.trim().replace(/\s+/g, ' ');
      if (!n) return invalid(f, 'full_name');
      if (n.split(' ').length < 2) return invalid(f, 'full_name', 'Укажите хотя бы фамилию и имя');
      var s = { id: nextId('students'), full_name: n, group_id: Number(f.elements.group_id.value), user_id: null };
      DB.students.push(s); state.groupId = s.group_id; state.q = '';
      if (f.elements.make_account.checked) { var cred = createAccount(s); render(); showCredentials(s, cred, 'Учётная запись создана'); }
      else { render(); toast('Студент добавлен'); }
      return f.elements.make_account.checked ? undefined : true;
    } });
  };
  HANDLERS['edit-student'] = function (t) {
    var s = byId(DB.students, Number(t.getAttribute('data-id')));
    modal({ title: 'Студент', body: studentForm(s), submit: 'Сохранить', onSubmit: function (f) {
      var n = f.elements.full_name.value.trim().replace(/\s+/g, ' ');
      if (!n) return invalid(f, 'full_name');
      var ng = Number(f.elements.group_id.value);
      if (ng !== s.group_id && DB.attendance.some(function (a) { return a.student_id === s.id; })) return 'Перевод в другую группу недоступен: у студента есть отметки в текущей группе. В готовой системе перевод оформляется отдельной операцией.';
      s.full_name = n; s.group_id = ng;
      if (s.user_id) byId(DB.users, s.user_id).full_name = n;
      toast('Изменения сохранены'); render(); return true;
    } });
  };
  HANDLERS['del-student'] = function (t) {
    var s = byId(DB.students, Number(t.getAttribute('data-id')));
    var n = DB.attendance.filter(function (a) { return a.student_id === s.id; }).length;
    if (n) { info('Нельзя удалить студента', 'У студента ' + s.full_name + ' есть ' + n + ' отметок посещаемости. История не удаляется. Отключите его учётную запись, если он отчислен.'); return; }
    confirmBox('Удалить студента?', s.full_name + (s.user_id ? ' будет удалён вместе с учётной записью.' : ' будет удалён.'), 'Удалить', function () {
      if (s.user_id) DB.users.splice(DB.users.indexOf(byId(DB.users, s.user_id)), 1);
      DB.students.splice(DB.students.indexOf(s), 1); toast('Студент удалён', 'i-trash'); render();
    });
  };

  function uniqueLogin(base) { var l = base || 'user', i = 1; while (DB.users.some(function (u) { return u.login === l; })) l = (base || 'user') + (++i); return l; }
  function createAccount(s) {
    var u = { id: nextId('users'), login: uniqueLogin(translit(s.full_name)), password: genPassword(), role: 'student', full_name: s.full_name, is_active: true };
    DB.users.push(u); s.user_id = u.id; return u;
  }
  function showCredentials(who, u, title) {
    modal({ title: title, body: '<p>Передайте данные для входа: <b>' + esc(who.full_name) + '</b>. Пароль показывается один раз, после закрытия окна его не увидеть.</p>' +
      '<div class="field"><div class="lbl">Логин</div><div class="secret"><span>' + esc(u.login) + '</span></div></div>' +
      '<div class="field"><div class="lbl">Временный пароль</div><div class="secret"><span>' + esc(u.password) + '</span></div></div>' +
      '<div class="alert info">' + ic('i-alert') + '<span>После входа пользователь может сменить пароль в разделе «Смена пароля».</span></div>' });
  }
  HANDLERS['student-account'] = function (t) {
    var s = byId(DB.students, Number(t.getAttribute('data-id')));
    var u = s.user_id ? byId(DB.users, s.user_id) : null;
    if (!u) {
      modal({ title: 'Учётная запись', body: '<p>У студента <b>' + esc(s.full_name) + '</b> нет учётной записи, он не может войти в кабинет.</p>', submit: 'Создать учётную запись', onSubmit: function () {
        var cred = createAccount(s); render(); showCredentials(s, cred, 'Учётная запись создана');
      } });
      return;
    }
    modal({ title: 'Учётная запись', body: '<div class="field"><div class="lbl">Логин</div><div class="secret"><span>' + esc(u.login) + '</span>' + (u.is_active ? '<span class="chip present">активна</span>' : '<span class="chip neutral">отключена</span>') + '</div></div>' +
      '<div class="actions"><button type="button" class="btn btn-ghost" data-m="reset">' + ic('i-key') + 'Сбросить пароль</button><button type="button" class="btn btn-ghost" data-m="toggle">' + ic('i-power') + (u.is_active ? 'Отключить' : 'Включить') + '</button></div>',
      onOpen: function (el) {
        el.querySelector('[data-m="reset"]').addEventListener('click', function () { u.password = genPassword(); render(); showCredentials(s, u, 'Пароль сброшен'); });
        el.querySelector('[data-m="toggle"]').addEventListener('click', function () { u.is_active = !u.is_active; render(); toast(u.is_active ? 'Учётная запись включена' : 'Учётная запись отключена'); });
      } });
  };

  /* ================= экран: предметы (admin) ================= */
  function pageSubjects() {
    var rows = DB.subjects.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); }).map(function (s) {
      var as = DB.assignments.filter(function (a) { return a.subject_id === s.id; }).length;
      var ls = DB.lessons.filter(function (l) { return l.subject_id === s.id; }).length;
      return '<tr><td data-label="Предмет"><span class="cell-main">' + esc(s.name) + '</span></td><td data-label="Назначений" class="num">' + as + '</td><td data-label="Занятий" class="num">' + ls + '</td>' +
        '<td class="act"><button class="icon-btn" data-act="edit-subject" data-id="' + s.id + '" aria-label="Изменить" title="Изменить">' + ic('i-edit') + '</button><button class="icon-btn danger" data-act="del-subject" data-id="' + s.id + '" aria-label="Удалить" title="Удалить">' + ic('i-trash') + '</button></td></tr>';
    }).join('');
    return {
      title: 'Предметы', sub: DB.subjects.length + ' предметов',
      actions: '<button class="btn btn-primary" data-act="add-subject">' + ic('i-plus') + 'Предмет</button>',
      html: '<div class="card">' + (rows ? '<div class="tbl-wrap"><table class="t resp"><thead><tr><th>Предмет</th><th class="num">Назначений</th><th class="num">Занятий</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">' + ic('i-book') + '<b>Предметов нет</b>Добавьте первый предмет</div>') + '</div>'
    };
  }
  function saveSubject(f, s) {
    var n = f.elements.name.value.trim();
    if (!n) return invalid(f, 'name');
    if (DB.subjects.some(function (x) { return x.name.toLowerCase() === n.toLowerCase() && (!s || x.id !== s.id); })) return 'Предмет с таким названием уже есть';
    if (s) s.name = n; else DB.subjects.push({ id: nextId('subjects'), name: n });
    toast(s ? 'Предмет сохранён' : 'Предмет добавлен'); render(); return true;
  }
  HANDLERS['add-subject'] = function () { modal({ title: 'Новый предмет', body: fld('Название', 'name', inp('name', '', 'text', ' maxlength="100" placeholder="Например, Операционные системы"')), submit: 'Добавить', onSubmit: function (f) { return saveSubject(f, null); } }); };
  HANDLERS['edit-subject'] = function (t) { var s = byId(DB.subjects, Number(t.getAttribute('data-id'))); modal({ title: 'Предмет', body: fld('Название', 'name', inp('name', s.name, 'text', ' maxlength="100"')), submit: 'Сохранить', onSubmit: function (f) { return saveSubject(f, s); } }); };
  HANDLERS['del-subject'] = function (t) {
    var s = byId(DB.subjects, Number(t.getAttribute('data-id')));
    var a = DB.assignments.filter(function (x) { return x.subject_id === s.id; }).length, l = DB.lessons.filter(function (x) { return x.subject_id === s.id; }).length;
    if (a || l) { info('Нельзя удалить предмет', 'Предмет «' + s.name + '» используется: назначений ' + a + ', занятий ' + l + '.'); return; }
    confirmBox('Удалить предмет?', 'Предмет «' + s.name + '» будет удалён.', 'Удалить', function () { DB.subjects.splice(DB.subjects.indexOf(s), 1); toast('Предмет удалён', 'i-trash'); render(); });
  };

  /* ================= экран: пользователи и назначения (admin) ================= */
  function pageUsers() {
    var tabs = '<div class="tabs" role="tablist"><button data-act="users-tab" data-tab="users" class="' + (state.usersTab === 'users' ? 'active' : '') + '">Пользователи</button><button data-act="users-tab" data-tab="assign" class="' + (state.usersTab === 'assign' ? 'active' : '') + '">Назначения преподавателей</button></div>';
    var html, actions;
    if (state.usersTab === 'users') {
      var order = { admin: 0, teacher: 1, student: 2 };
      var rows = DB.users.slice().sort(function (a, b) { return order[a.role] - order[b.role] || a.full_name.localeCompare(b.full_name, 'ru'); }).map(function (u) {
        var st = u.role === 'student' ? DB.students.filter(function (s) { return s.user_id === u.id; })[0] : null;
        return '<tr><td data-label="Пользователь"><div class="cell-main">' + esc(u.full_name) + '</div>' + (st ? '<div class="cell-sub">Группа ' + esc(groupName(st.group_id)) + '</div>' : '') + '</td>' +
          '<td data-label="Логин"><span class="mono">' + esc(u.login) + '</span></td><td data-label="Роль"><span class="chip ' + (u.role === 'admin' ? 'accent' : 'neutral') + '">' + ROLE[u.role] + '</span></td>' +
          '<td data-label="Статус">' + (u.is_active ? '<span class="chip present">' + ic('i-present') + 'Активен</span>' : '<span class="chip neutral">Отключён</span>') + '</td>' +
          '<td class="act">' + (u.role !== 'student' ? '<button class="icon-btn" data-act="edit-user" data-id="' + u.id + '" title="Изменить" aria-label="Изменить">' + ic('i-edit') + '</button>' : '') +
          '<button class="icon-btn" data-act="reset-user" data-id="' + u.id + '" title="Сбросить пароль" aria-label="Сбросить пароль">' + ic('i-key') + '</button>' +
          '<button class="icon-btn" data-act="toggle-user" data-id="' + u.id + '" title="' + (u.is_active ? 'Отключить' : 'Включить') + '" aria-label="' + (u.is_active ? 'Отключить' : 'Включить') + '">' + ic('i-power') + '</button>' +
          '<button class="icon-btn danger" data-act="del-user" data-id="' + u.id + '" title="Удалить" aria-label="Удалить">' + ic('i-trash') + '</button></td></tr>';
      }).join('');
      actions = '<button class="btn btn-primary" data-act="add-user">' + ic('i-plus') + 'Сотрудник</button>';
      html = '<div class="alert info" style="margin-bottom:var(--sp-4)">' + ic('i-alert') + '<span>Учётные записи студентов создаются в разделе «Группы и студенты». Здесь добавляются администраторы и преподаватели.</span></div>' +
        '<div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Пользователь</th><th>Логин</th><th>Роль</th><th>Статус</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
    } else {
      var arows = DB.assignments.slice().sort(function (a, b) { return userName(a.teacher_id).localeCompare(userName(b.teacher_id), 'ru') || groupName(a.group_id).localeCompare(groupName(b.group_id)); }).map(function (a) {
        var ls = DB.lessons.filter(function (l) { return l.teacher_id === a.teacher_id && l.group_id === a.group_id && l.subject_id === a.subject_id; }).length;
        return '<tr><td data-label="Преподаватель"><span class="cell-main">' + esc(userName(a.teacher_id)) + '</span></td><td data-label="Группа">' + esc(groupName(a.group_id)) + '</td><td data-label="Предмет">' + esc(subjName(a.subject_id)) + '</td><td data-label="Занятий" class="num">' + ls + '</td>' +
          '<td class="act"><button class="icon-btn danger" data-act="del-assign" data-id="' + a.id + '" title="Удалить" aria-label="Удалить">' + ic('i-trash') + '</button></td></tr>';
      }).join('');
      actions = '<button class="btn btn-primary" data-act="add-assign">' + ic('i-plus') + 'Назначение</button>';
      html = '<div class="alert info" style="margin-bottom:var(--sp-4)">' + ic('i-alert') + '<span>Преподаватель видит только группы и предметы из своих назначений.</span></div>' +
        '<div class="card">' + (arows ? '<div class="tbl-wrap"><table class="t resp"><thead><tr><th>Преподаватель</th><th>Группа</th><th>Предмет</th><th class="num">Занятий</th><th></th></tr></thead><tbody>' + arows + '</tbody></table></div>' : '<div class="empty">' + ic('i-shield') + '<b>Назначений нет</b>Добавьте первое назначение</div>') + '</div>';
    }
    return { title: 'Пользователи и назначения', sub: DB.users.length + ' учётных записей, ' + DB.assignments.length + ' назначений', actions: actions, html: tabs + html };
  }
  HANDLERS['users-tab'] = function (t) { state.usersTab = t.getAttribute('data-tab'); render(); };
  function userForm(u) {
    return '<div class="form-grid"><div class="full">' + fld('ФИО', 'full_name', inp('full_name', u ? u.full_name : '', 'text', ' maxlength="150"')) + '</div>' +
      fld('Логин', 'login', inp('login', u ? u.login : '', 'text', ' maxlength="50" autocapitalize="none"'), 'Латиница и цифры, от 3 символов') +
      fld('Роль', 'role', sel('role', [['teacher', 'Преподаватель'], ['admin', 'Администратор']], u ? u.role : 'teacher')) + '</div>' +
      (u ? '' : '<div class="alert info">' + ic('i-alert') + '<span>Временный пароль будет создан автоматически и показан после сохранения.</span></div>');
  }
  function saveUser(f, u) {
    var n = f.elements.full_name.value.trim(), l = f.elements.login.value.trim().toLowerCase(), role = f.elements.role.value, ok = true;
    if (!n) ok = invalid(f, 'full_name');
    if (!/^[a-z0-9._-]{3,50}$/.test(l)) ok = invalid(f, 'login', 'Латиница, цифры, точка, дефис; от 3 символов');
    if (!ok) return false;
    if (DB.users.some(function (x) { return x.login === l && (!u || x.id !== u.id); })) return 'Логин «' + l + '» уже занят';
    if (u) {
      if (u.role === 'teacher' && role !== 'teacher' && DB.assignments.some(function (a) { return a.teacher_id === u.id; })) return 'Нельзя сменить роль: у преподавателя есть назначения';
      if (u.id === state.user.id && role !== 'admin') return 'Нельзя снять роль администратора с самого себя';
      u.full_name = n; u.login = l; u.role = role; toast('Изменения сохранены'); render(); return true;
    }
    var nu = { id: nextId('users'), login: l, password: genPassword(), role: role, full_name: n, is_active: true };
    DB.users.push(nu); render(); showCredentials(nu, nu, 'Сотрудник добавлен');
  }
  HANDLERS['add-user'] = function () { modal({ title: 'Новый сотрудник', body: userForm(null), submit: 'Добавить', onSubmit: function (f) { return saveUser(f, null); } }); };
  HANDLERS['edit-user'] = function (t) { var u = byId(DB.users, Number(t.getAttribute('data-id'))); modal({ title: 'Пользователь', body: userForm(u), submit: 'Сохранить', onSubmit: function (f) { return saveUser(f, u); } }); };
  HANDLERS['reset-user'] = function (t) {
    var u = byId(DB.users, Number(t.getAttribute('data-id')));
    confirmBox('Сбросить пароль?', 'Для ' + u.full_name + ' будет создан новый временный пароль. Старый перестанет работать.', 'Сбросить', function () { u.password = genPassword(); setTimeout(function () { showCredentials(u, u, 'Пароль сброшен'); }, 0); });
  };
  HANDLERS['toggle-user'] = function (t) {
    var u = byId(DB.users, Number(t.getAttribute('data-id')));
    if (u.id === state.user.id) { info('Действие недоступно', 'Нельзя отключить собственную учётную запись.'); return; }
    u.is_active = !u.is_active; toast(u.is_active ? 'Учётная запись включена' : 'Учётная запись отключена'); render();
  };
  HANDLERS['del-user'] = function (t) {
    var u = byId(DB.users, Number(t.getAttribute('data-id')));
    if (u.id === state.user.id) { info('Действие недоступно', 'Нельзя удалить собственную учётную запись.'); return; }
    var a = DB.assignments.filter(function (x) { return x.teacher_id === u.id; }).length, l = DB.lessons.filter(function (x) { return x.teacher_id === u.id; }).length;
    var st = DB.students.filter(function (s) { return s.user_id === u.id; })[0];
    if (a || l) { info('Нельзя удалить пользователя', 'У преподавателя есть назначения (' + a + ') и занятия (' + l + '). Отключите учётную запись вместо удаления.'); return; }
    if (st) { info('Нельзя удалить пользователя', 'Учётная запись привязана к студенту ' + st.full_name + '. Отключите её или удалите студента в разделе «Группы и студенты».'); return; }
    confirmBox('Удалить пользователя?', u.full_name + ' (' + u.login + ') будет удалён.', 'Удалить', function () { DB.users.splice(DB.users.indexOf(u), 1); toast('Пользователь удалён', 'i-trash'); render(); });
  };
  HANDLERS['add-assign'] = function () {
    var teachers = DB.users.filter(function (u) { return u.role === 'teacher' && u.is_active; }).map(function (u) { return [u.id, u.full_name]; });
    if (!teachers.length || !DB.groups.length || !DB.subjects.length) { info('Не хватает данных', 'Для назначения нужны активный преподаватель, группа и предмет.'); return; }

      if (f.from && l.lesson_date < f.from) return false;
      if (f.to && l.lesson_date > f.to) return false;
      if (sc.pairs && !sc.pairs.some(function (a) { return a.group_id === l.group_id && a.subject_id === l.subject_id && l.teacher_id === state.user.id; })) return false;

        '<div class="cnt"><span>Был: ' + c.present + '</span><span>Опоздал: ' + c.late + '</span><span>Не был: ' + c.absent + '</span><span>Уваж.: ' + c.excused + '</span></div></div>';
    }).join('');
    var hist = recs.map(function (a) { return { a: a, l: byId(DB.lessons, a.lesson_id) }; }).sort(function (x, y) { return y.l.lesson_date.localeCompare(x.l.lesson_date) || y.l.pair_number - x.l.pair_number; })
      .map(function (x) { return '<tr><td data-label="Дата">' + fmtDate(x.l.lesson_date) + ', ' + x.l.pair_number + ' пара</td><td data-label="Предмет">' + esc(subjName(x.l.subject_id)) + '</td><td data-label="Статус">' + chip(x.a.status) + '</td></tr>'; }).join('');
    return { cards: cards, hist: hist, total: calc(recs) };
  }
  HANDLERS['student-report'] = function (t) {
    var s = byId(DB.students, Number(t.getAttribute('data-id')));
    var d = studentDetail(s, repLessons(state.rep));
    modal({ wide: true, title: s.full_name, body: '<div class="muted">Группа ' + esc(groupName(s.group_id)) + ', период ' + fmtDate(state.rep.from) + ' — ' + fmtDate(state.rep.to) + '. Общая посещаемость: <b style="color:var(--accent)">' + pctText(d.total.pct) + '</b></div>' +
      (d.cards ? '<div class="subj-grid">' + d.cards + '</div>' : '') +
      (d.hist ? '<div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Дата</th><th>Предмет</th><th>Статус</th></tr></thead><tbody>' + d.hist + '</tbody></table></div></div>' : '<div class="empty"><b>Отметок за период нет</b></div>') });
  };

  /* ================= экран: кабинет студента ================= */
  function pageCabinet() {
    var s = DB.students.filter(function (x) { return x.user_id === state.user.id; })[0];
    if (!s) return { title: 'Моя посещаемость', html: '<div class="card"><div class="empty">' + ic('i-alert') + '<b>Учётная запись не привязана к студенту</b>Обратитесь к администратору.</div></div>' };
    var ls = DB.lessons.filter(function (l) { return l.group_id === s.group_id; });
    var subIds = []; ls.forEach(function (l) { if (subIds.indexOf(l.subject_id) < 0) subIds.push(l.subject_id); });
    var filtered = state.cabSubject === 'all' ? ls : ls.filter(function (l) { return l.subject_id === state.cabSubject; });
    var all = studentDetail(s, ls), d = studentDetail(s, filtered);
    var first = s.full_name.split(' ')[1] || s.full_name;
    return {
      title: 'Моя посещаемость', sub: 'Группа ' + esc(groupName(s.group_id)),
      html: '<div class="stack"><div class="card hello"><div><h2>Здравствуйте, ' + esc(first) + '</h2><div class="muted">Данные по всем занятиям вашей группы. Отметки ставит преподаватель.</div></div><div style="text-align:right"><div class="big-pct">' + pctText(all.total.pct) + '</div><div class="muted" style="font-size:13px">общая посещаемость</div></div></div>' +
        '<div class="kpis"><div class="card kpi"><div class="v">' + all.total.total + '</div><div class="l">Отмечено занятий</div></div><div class="card kpi"><div class="v">' + all.total.absent + '</div><div class="l">Пропусков</div></div><div class="card kpi"><div class="v">' + all.total.late + '</div><div class="l">Опозданий</div></div><div class="card kpi"><div class="v">' + all.total.excused + '</div><div class="l">По уважительной</div></div></div>' +
        '<div><h3 style="font-size:16px;font-weight:800;margin-bottom:12px">По предметам</h3><div class="subj-grid">' + (all.cards || '<div class="muted">Пока нет данных</div>') + '</div></div>' +
        '<div class="card"><div class="card-head"><h3>История отметок</h3><div class="field" style="min-width:200px">' + sel('cab-s', [['all', 'Все предметы']].concat(subIds.map(function (id) { return [id, subjName(id)]; })), state.cabSubject).replace('<select', '<select data-change="cab" aria-label="Предмет"') + '</div></div>' +
        (d.hist ? '<div class="tbl-wrap"><table class="t resp"><thead><tr><th>Дата</th><th>Предмет</th><th>Статус</th></tr></thead><tbody>' + d.hist + '</tbody></table></div>' : '<div class="empty">' + ic('i-calendar') + '<b>Отметок пока нет</b></div>') + '</div></div>'
    };
  }
  HANDLERS.cab = function (t) { state.cabSubject = t.value === 'all' ? 'all' : Number(t.value); render(); };

  /* ================= экран: смена пароля (все роли) ================= */
  function pagePassword() {
    return {
      title: 'Смена пароля', sub: 'Учётная запись: ' + esc(state.user.login),
      html: '<div class="card card-pad" style="max-width:520px"><form id="pwForm" class="stack" novalidate>' +
        '<div class="alert ok" id="pwOk" style="display:none">' + ic('i-check') + '<span>Пароль изменён. Используйте его при следующем входе.</span></div>' +
        '<div class="alert err" id="pwBad" style="display:none">' + ic('i-alert') + '<span></span></div>' +
        fld('Текущий пароль', 'cur', inp('cur', '', 'password', ' autocomplete="current-password"')) +
        fld('Новый пароль', 'np', inp('np', '', 'password', ' autocomplete="new-password"'), 'Не короче 8 символов') +
        fld('Повторите новый пароль', 'np2', inp('np2', '', 'password', ' autocomplete="new-password"')) +
        '<div><button class="btn btn-primary" type="submit">' + ic('i-save') + 'Сохранить пароль</button></div></form></div>',
      after: function () {
        var f = document.getElementById('pwForm');
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          var ok = document.getElementById('pwOk'), bad = document.getElementById('pwBad');
          ok.style.display = 'none'; bad.style.display = 'none';
          f.querySelectorAll('.field').forEach(function (x) { x.classList.remove('invalid'); });
          var c = f.elements.cur.value, n = f.elements.np.value, n2 = f.elements.np2.value, v = true;
          if (!c) v = invalid(f, 'cur');
          if (n.length < 8) v = invalid(f, 'np', 'Не короче 8 символов');
          if (n2 !== n) v = invalid(f, 'np2', 'Пароли не совпадают');
          if (!v) return;
          if (c !== state.user.password) { bad.style.display = 'flex'; bad.querySelector('span').textContent = 'Текущий пароль указан неверно'; return; }
          if (n === c) { invalid(f, 'np', 'Новый пароль совпадает с текущим'); return; }
          state.user.password = n; f.reset(); ok.style.display = 'flex'; toast('Пароль изменён');
        });
      }
    };
  }

  var PAGES = { groups: pageGroups, subjects: pageSubjects, users: pageUsers, lessons: pageLessons, lesson: pageLesson, reports: pageReports, cabinet: pageCabinet, password: pagePassword };

  /* тема на экране входа (кнопка вне делегированных зон обрабатывается тем же обработчиком) */
  render();
})();
</script>
</body>
</html>
